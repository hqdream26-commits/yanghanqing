<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨翰卿 - 技术博客</title>
    <link rel="stylesheet" href="./css/style.min.css">
    <link rel="stylesheet" href="./css/music-player.css">
    <link rel="stylesheet" href="./css/ai-assistant.css">
    <link rel="stylesheet" href="./css/meteor-shower.css">
    <link rel="shortcut icon" href="./assets/public/favicon.svg" />
    <!-- 引入Markdown解析和代码高亮库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <!-- 文章详情面板样式（专业技术排版） -->
    <style>
        /* 遮罩层 */
        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 998;
            display: none;
            backdrop-filter: blur(4px);
        }

        .mask.show {
            display: block;
        }

        /* 文章详情侧边面板 */
        .article-detail-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 650px;
            max-width: 100vw;
            height: 100vh;
            background: #121217;
            border-left: 1px solid #2a2a35;
            z-index: 999;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .article-detail-panel.show {
            right: 0;
        }

        /* 面板头部 */
        .detail-header {
            position: sticky;
            top: 0;
            background: #121217;
            padding: 30px 40px 20px;
            border-bottom: 1px solid #2a2a35;
            z-index: 10;
        }

        .detail-header h2 {
            margin: 0 40px 15px 0;
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            line-height: 1.3;
        }

        .detail-close {
            position: absolute;
            top: 25px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: #252530;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-close:hover {
            background: #ff4757;
            transform: rotate(90deg);
        }

        /* 元信息 */
        .detail-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #999;
            font-size: 14px;
        }

        .detail-meta img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .detail-meta .tag {
            background: #2d2d3a;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #61dafb;
        }

        /* 文章内容容器 */
        .detail-content {
            padding: 30px 40px 60px;
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Markdown元素样式 */
        .detail-content h1,
        .detail-content h2,
        .detail-content h3 {
            color: #ffffff;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .detail-content h1 {
            font-size: 24px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .detail-content h2 {
            font-size: 20px;
        }

        .detail-content h3 {
            font-size: 18px;
        }

        .detail-content p {
            margin: 15px 0;
        }

        .detail-content ul,
        .detail-content ol {
            margin: 15px 0;
            padding-left: 25px;
        }

        .detail-content li {
            margin: 8px 0;
        }

        .detail-content strong {
            color: #ffffff;
        }

        .detail-content a {
            color: #61dafb;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .detail-content a:hover {
            border-bottom-color: #61dafb;
        }

        .detail-content blockquote {
            border-left: 4px solid #61dafb;
            padding: 10px 20px;
            margin: 20px 0;
            background: #1e1e28;
            color: #b0b0b0;
            border-radius: 0 4px 4px 0;
        }

        /* 表格样式 */
        .detail-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }

        .detail-content th,
        .detail-content td {
            border: 1px solid #333;
            padding: 10px 15px;
            text-align: left;
        }

        .detail-content th {
            background: #252530;
            color: #ffffff;
            font-weight: 600;
        }

        .detail-content tr:nth-child(even) {
            background: #1a1a22;
        }

        /* 代码块样式（带复制按钮） */
        .detail-content pre {
            position: relative;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #282c34 !important;
        }

        .detail-content code {
            font-family: "Fira Code", "Consolas", monospace;
            font-size: 14px;
        }

        .detail-content pre code {
            display: block;
            padding: 20px;
            overflow-x: auto;
            line-height: 1.6;
        }

        .detail-content :not(pre)>code {
            background: #252530;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ff79c6;
        }

        /* 复制按钮 */
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            background: #3a3a4a;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
        }

        .detail-content pre:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: #4a4a5a;
        }

        .copy-btn.copied {
            background: #2ed573;
            color: #fff;
        }

        /* 滚动条美化 */
        .article-detail-panel::-webkit-scrollbar {
            width: 8px;
        }

        .article-detail-panel::-webkit-scrollbar-track {
            background: #121217;
        }

        .article-detail-panel::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 4px;
        }

        .article-detail-panel::-webkit-scrollbar-thumb:hover {
            background: #4a4a5a;
        }

        /* 禁止页面滚动 */
        body.no-scroll {
            overflow: hidden;
        }

        /* ===================== 博客引言区块样式 ===================== */
        .blog-intro-card {
            position: relative;
            border: 1px solid #2a2a40;
            border-radius: 12px;
            padding: 28px 32px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #1a1a28 0%, #151520 40%, #1a1a2e 100%);
            overflow: hidden;
            cursor: default;
        }

        .blog-intro-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #61dafb, #a78bfa, #61dafb);
            border-radius: 4px 0 0 4px;
        }

        .blog-intro-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(97, 218, 251, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .blog-intro-card .intro-icon {
            font-size: 28px;
            margin-bottom: 10px;
            display: block;
        }

        .blog-intro-card .intro-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .blog-intro-card .intro-text {
            font-size: 15px;
            color: #b8b8c8;
            line-height: 1.8;
            margin: 0;
            max-width: 95%;
        }

        .blog-intro-card .intro-text strong {
            color: #61dafb;
        }

        .blog-intro-card .intro-highlight {
            display: inline-block;
            background: rgba(97, 218, 251, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            color: #61dafb;
            font-weight: 500;
        }

        /* ===================== 政策指引卡片样式 ===================== */
        .blog-policy-card {
            position: relative;
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 14px;
            padding: 22px 28px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.06) 0%, rgba(99, 97, 220, 0.03) 50%, rgba(97, 218, 251, 0.04) 100%);
            overflow: hidden;
        }

        .blog-policy-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 80%, rgba(97, 218, 251, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .blog-policy-card .policy-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            position: relative;
        }

        .blog-policy-card .policy-icon {
            font-size: 22px;
            filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.4));
        }

        .blog-policy-card .policy-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .blog-policy-card .policy-desc {
            font-size: 13px;
            color: #a0a0b8;
            line-height: 1.7;
            position: relative;
            margin-bottom: 14px;
        }

        .blog-policy-card .policy-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
        }

        .policy-link-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #b8b8c8;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.25s;
            cursor: pointer;
        }

        .policy-link-item:hover {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.4);
            color: #a78bfa;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
        }

        .policy-link-item .arrow {
            font-size: 11px;
            opacity: 0.6;
            transition: transform 0.2s;
        }

        .policy-link-item:hover .arrow {
            transform: translateX(2px);
            opacity: 1;
        }

        /* ===================== 引言卡片增强 ===================== */
        .blog-intro-card .intro-timeline {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #888;
        }

        .blog-intro-card .intro-timeline .milestone {
            padding: 3px 10px;
            border-radius: 10px;
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            font-weight: 500;
            white-space: nowrap;
        }

        .blog-intro-card .intro-timeline .arrow-sep {
            color: #555;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .blog-policy-card {
                padding: 16px 14px;
                border-radius: 10px;
            }

            .blog-policy-card .policy-title {
                font-size: 15px;
            }

            .blog-policy-card .policy-desc {
                font-size: 12px;
            }

            .policy-link-item {
                padding: 5px 10px;
                font-size: 11px;
            }

            .blog-intro-card .intro-timeline {
                font-size: 11px;
                gap: 4px;
            }
        }
            .article-detail-panel {
                width: 100vw;
            }

            .detail-header {
                padding: 20px 20px 15px;
            }

            .detail-content {
                padding: 20px 20px 40px;
            }

            .detail-header h2 {
                font-size: 22px;
            }

            .blog-intro-card {
                padding: 20px 18px;
                border-radius: 10px;
            }

            .blog-intro-card .intro-title {
                font-size: 18px;
            }

            .blog-intro-card .intro-text {
                font-size: 14px;
                max-width: 100%;
            }

            .blog-policy-card {
                padding: 16px 14px;
                border-radius: 10px;
            }

            .blog-policy-card .policy-title {
                font-size: 15px;
            }

            .blog-policy-card .policy-desc {
                font-size: 12px;
            }

            .policy-link-item {
                padding: 5px 10px;
                font-size: 11px;
            }

            .blog-intro-card .intro-timeline {
                font-size: 11px;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- 遮罩层 -->
    <div class="mask" id="mask" onclick="closeArticleDetail()"></div>
    <canvas class="fireworks"></canvas>
    <div class="head">
        <div class="main">
            <a href="./index.html" class="logo"><img src="./assets/public/logo_text.png" width="62px" height="30px"></a>
            <div class="menu">
                <li class="magical btn" onclick="window.location.href='./index.html'">首页</li>
                <li class="magical btn" onclick="window.location.href='./work.html'">作品</li>
                <li class="magical btn nav" onclick="window.location.href='./blog.html'">知识</li>
                <li class="magical btn" onclick="window.location.href='./about.html'">关于</li>
            </div>
            <div class="menu" id="menu-expand">
                <li class="magical btn skin" id="menu-expand-child"><i class="icon menu-icon"></i></li>
            </div>
            <div id="menu-panel">
                <div class="menu-panel-content">
                    <li class="magical btn" onclick="window.location.href='./index.html'">首页</li>
                    <li class="magical btn" onclick="window.location.href='./work.html'">作品</li>
                    <li class="magical btn nav" onclick="window.location.href='./blog.html'">知识</li>

    </div>
    <!-- 文章详情侧边面板 -->
    <div class="article-detail-panel" id="articleDetail">
        <div class="detail-header">
            <h2 id="detailTitle">文章标题</h2>
            <button class="detail-close" onclick="closeArticleDetail()">×</button>
            <div class="detail-meta">
                <img id="detailAvatar" src="./assets/blog/avatar.svg" alt="头像">

            <div class="rising-stars rising-stars-visible">
                <div style="height:1px;width:1px"></div>

                <div style="height:1px;width:1px"></div>
            </div>
        </div>
        <div class="shape-earth"></div>
    </div>

    <!-- 全站背景音乐播放器 -->
    <div class="full-width-player" id="player">
        <audio id="bgMusic" preload="auto"></audio>
        <div class="player-content">
            <div class="song-switch-area">
                <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn play-btn" id="playPauseBtn" title="点击播放">▶</button>
                <div class="playing-indicator" id="playingIndicator">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

                <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
            </div>
            <div class="song-info-area">
                <div class="song-title-main" id="songTitleDisplay">准备就绪</div>
                <div class="song-artist-main" id="songArtistDisplay">点击播放音乐</div>
            </div>
            <div class="volume-area">
                <button class="ctrl-btn" id="muteBtn" style="font-size:14px;" title="静音切换">🔊</button>

            </div>

    <script>
        // ===================== 配置Markdown解析器 =====================
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true,
            headerIds: false
        });



        // ===================== 动态生成文章列表（含引言卡片） =====================
        function renderBlogList() {
            const blogList = document.getElementById('blogList');

            // 引言卡片HTML
            const introCardHTML = `
            <div class="blog-intro-card">
              <span class="intro-icon">🚀</span>
              <h3 class="intro-title">AI时代，人人都是创造者</h3>
              <p class="intro-text">
                2025年，以大模型为代表的AI技术正在<span class="intro-highlight">重塑每一个行业</span>。医疗、金融、教育、农业、法律、制造——无论你身处哪个领域，<strong>编程与AI已不再是程序员的专属技能</strong>，而是各行各业的"新通用语"。学会用代码解决问题、用AI放大能力，意味着你能<span class="intro-highlight">十倍速提升专业效率</span>。医生用AI辅助诊断，律师用大模型审查合同，农民用物联网管理农田——<strong>不会编程的人，正在失去与AI协作的机会</strong>。以下内容将以不同专业为切口，展示<strong>编程、互联网技术、大模型如何与各行业深度结合</strong>。时代不会等待观望者——<strong>主动拥抱，方能乘势而上</strong>。
              </p>
            </div>
          `;

            // 文章列表HTML
            const articlesHTML = articles.map((article, index) => `
            <div class="item">
              <a href="javascript:;" onclick="showArticleDetail(${index})">
                <div class="text">
                  <div class="title-area">
                    <div class="title">
                      <div class="name">${article.title}</div>
                      <div class="link"> ↗</div>
                    </div>
                    <div class="tag">${article.tag}</div>
                  </div>
                  <div class="desc">${article.content.substring(0, 120)}...</div>
                </div>
                <div class="info">
                  <div class="info-avatar"><img src="./assets/blog/avatar.svg"></div>
                  <div class="info-name">杨翰卿</div>
                  <div class="info-time">${article.time}</div>
                </div>
              </a>
              <div class="content-divider"></div>
            </div>
          `).join('');

            blogList.innerHTML = introCardHTML + articlesHTML;
        }

        // ===================== 打开文章详情 =====================
        function showArticleDetail(index) {
            const article = articles[index];
            // 填充基本信息
            document.getElementById('detailTitle').innerText = article.title;
            document.getElementById('detailTime').innerText = article.time;
            document.getElementById('detailTag').innerText = article.tag;
            // 解析Markdown内容
            const htmlContent = marked.parse(article.content);
            document.getElementById('detailContent').innerHTML = htmlContent;
            // 为所有代码块添加复制按钮
            addCopyButtons();
            // 显示面板
            document.getElementById('articleDetail').classList.add('show');
            document.getElementById('mask').classList.add('show');
            document.body.classList.add('no-scroll');
            // 滚动到顶部
            document.getElementById('articleDetail').scrollTop = 0;
        }

        // ===================== 关闭文章详情 =====================
        function closeArticleDetail() {
            document.getElementById('articleDetail').classList.remove('show');
            document.getElementById('mask').classList.remove('show');
            document.body.classList.remove('no-scroll');
        }

        // ===================== 添加代码复制按钮 =====================
        function addCopyButtons() {
            const codeBlocks = document.querySelectorAll('.detail-content pre');
            codeBlocks.forEach((pre, index) => {
                // 创建复制按钮
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '复制代码';
                copyBtn.setAttribute('data-index', index);
                // 绑定点击事件
                copyBtn.addEventListener('click', function() {
                    const code = pre.querySelector('code').innerText;
                    // 复制到剪贴板
                    navigator.clipboard.writeText(code).then(() => {
                        this.innerText = '已复制 ✓';
                        this.classList.add('copied');
                        // 2秒后恢复
                        setTimeout(() => {
                            this.innerText = '复制代码';
                            this.classList.remove('copied');
                        }, 2000);
                    }).catch(err => {
                        this.innerText = '复制失败';
                        console.error('复制失败:', err);
                    });
                });
                pre.appendChild(copyBtn);
            });
        }

        // ===================== 原有鼠标魔法效果 =====================
        window.addEventListener("mousemove", function(e) {
            document.querySelectorAll(".magical").forEach(element => {
                const rect = element.getBoundingClientRect();
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;
                element.style.setProperty("--mouse-x", `${offsetX}px`);
                element.style.setProperty("--mouse-y", `${offsetY}px`);
            });
        });

        // ===================== 页面初始化 =====================
        document.addEventListener('DOMContentLoaded', function() {
            renderBlogList();
            // 支持ESC键关闭面板
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeArticleDetail();
                }
            });
        });
    </script>
