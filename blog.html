## 1. useState：状态管理
useState用于在函数组件中添加状态。

### 基本用法
\`\`\`javascript
import React, { useState } from 'react';

function Counter() {
  const [count, setCount] = useState(0);

  return (
    <div>
      <p>当前计数: {count}</p>
      <button onClick={() => setCount(count + 1)}>
        增加
      </button>
    </div>
  );
}
\`\`\`

### 状态更新规则
- **异步更新**：状态更新不会立即生效
- **批量更新**：多个setState会合并执行
- **函数式更新**：推荐使用函数形式获取最新状态

\`\`\`javascript
// ✅ 推荐：函数式更新
setCount(prevCount => prevCount + 1);

// ❌ 不推荐：直接使用当前状态
setCount(count + 1);
\`\`\`

## 2. useEffect：副作用处理
useEffect用于处理组件的副作用，如数据获取、订阅等。

### 依赖数组
\`\`\`javascript
useEffect(() => {
  // 副作用逻辑
  return () => {
    // 清理逻辑
  };
}, [dependencies]); // 依赖数组
\`\`\`

### 常见场景
| 依赖数组 | 执行时机 | 使用场景 |
|---|---|---|
| [] | 组件挂载和卸载 | 初始化、订阅 |
| [dep] | dep变化时 | 监听特定状态 |
| 无依赖 | 每次渲染后 | 不推荐 |

### 实战示例
\`\`\`javascript
function UserList() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('/api/users')
      .then(res => res.json())
      .then(data => {
        setUsers(data);
        setLoading(false);
      })
      .catch(error => {
        console.error('获取用户列表失败:', error);
        setLoading(false);
      });
    return () => {
      console.log('组件卸载');
    };
  }, []);

  if (loading) return <div>加载中...</div>;
  return (
    <ul>
      {users.map(user => (
        <li key={user.id}>{user.name}</li>
      ))}
    </ul>
  );
}
\`\`\`

## 3. useMemo与useCallback
### useMemo：缓存计算结果
\`\`\`javascript
const expensiveValue = useMemo(() => {
  console.log('执行耗时计算');
  return items.filter(item => item.active);
}, [items]);
\`\`\`

### useCallback：缓存函数
\`\`\`javascript
const handleClick = useCallback((id) => {
  console.log('点击了:', id);
}, []);
\`\`\`

> **性能优化建议**：不要过度使用，只有在确定有性能问题时才使用。

## 4. 自定义Hooks
### 示例：useFetch
\`\`\`javascript
function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const controller = new AbortController();
    fetch(url, { signal: controller.signal })
      .then(res => res.json())
      .then(setData)
      .catch(err => {
        if (err.name !== 'AbortError') setError(err);
      })
      .finally(() => setLoading(false));
    return () => controller.abort();
  }, [url]);

  return { data, loading, error };
}
\`\`\`

## 5. Hooks使用规则
1. **只在顶层调用**：不要在循环、条件或嵌套函数中调用
2. **只在React函数中调用**：不要在普通JavaScript函数中调用
3. **命名规范**：自定义Hook以use开头

\`\`\`javascript
// ❌ 错误示例
if (condition) {
  const [state, setState] = useState();
}
// ✅ 正确示例
const [state, setState] = useState();
if (condition) { /* 使用state */ }
\`\`\`

## 1. 条件类型
条件类型允许根据条件选择不同的类型。

### 基本语法
\`\`\`typescript
type IsString<T> = T extends string ? true : false;
type A = IsString<'hello'>; // true
type B = IsString<123>; // false
\`\`\`

### Exclude与Extract
\`\`\`typescript
type T0 = Exclude<'a' | 'b' | 'c', 'a'>; // 'b' | 'c'
type T1 = Extract<'a' | 'b' | 'c', 'a' | 'd'>; // 'a'
\`\`\`

## 2. 映射类型
### Readonly与Partial
\`\`\`typescript
type Readonly<T> = { readonly [P in keyof T]: T[P] };
type Partial<T> = { [P in keyof T]?: T[P] };
type Required<T> = { [P in keyof T]-?: T[P] };

interface Config {
  host: string;
  port?: number;
  timeout?: number;
}
type PartialConfig = Partial<Config>;
type RequiredConfig = Required<Config>;
\`\`\`

## 3. 模板字面量类型
\`\`\`typescript
type Size = 'small' | 'medium' | 'large';
type Variant = 'primary' | 'secondary' | 'danger';
type ClassName = \`\${Size}-\${Variant}\`;
const className: ClassName = 'medium-primary'; // ✅
\`\`\`

## 4. 工具类型实战
### 实现Pick、Omit、Record
\`\`\`typescript
type MyPick<T, K extends keyof T> = { [P in K]: T[P] };
type MyOmit<T, K extends keyof any> = { [P in keyof T as P extends K ? never : P]: T[P] };
type MyRecord<K extends keyof any, T> = { [P in K]: T };

interface User { id: number; name: string; email: string; age: number; }
type UserInfo = MyPick<User, 'id' | 'name'>;
type UserWithoutEmail = MyOmit<User, 'email'>;
type State = MyRecord<'loading' | 'error' | 'success', boolean>;
\`\`\`

## 5. 泛型约束与默认值
\`\`\`typescript
function getProperty<T, K extends keyof T>(obj: T, key: K): T[K] {
  return obj[key];
}
function createArray<T = string>(length: number, value: T): T[] {
  return Array(length).fill(value);
}
\`\`\`

> **最佳实践**：合理使用泛型约束，避免过度复杂的类型定义。

## 1. 加载性能优化
### 代码分割（Code Splitting）
\`\`\`javascript
const loadDashboard = () => import('./Dashboard');
function App() {
  const [showDashboard, setShowDashboard] = useState(false);
  const handleClick = async () => {
    await loadDashboard();
    setShowDashboard(true);
  };
  return (

    </div>
  );
}
\`\`\`

### 预加载与预获取
\`\`\`html
<link rel="preload" href="/styles/main.css" as="style">
<link rel="prefetch" href="/scripts/next-page.js">
\`\`\`

### 懒加载图片
\`\`\`javascript
function LazyImage({ src, alt }) {
  const [loaded, setLoaded] = useState(false);
  return (
    <img
      src={loaded ? src : 'placeholder.jpg'}
      alt={alt}
      onLoad={() => setLoaded(true)}
      loading="lazy"
    />
  );
}
\`\`\`

## 2. 运行时性能优化
### 虚拟列表
\`\`\`javascript
import { FixedSizeList as List } from 'react-window';
const Row = ({ index, style }) => <div style={style}>Row {index}</div>;
const VirtualList = () => (
  <List height={600} itemCount={10000} itemSize={35} width="100%">
    {Row}
  </List>
);
\`\`\`

### 防抖与节流
\`\`\`javascript
function useDebounce(value, delay) {
  const [debouncedValue, setDebouncedValue] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebouncedValue(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);
  return debouncedValue;
}

function useThrottle(value, delay) {
  const [throttledValue, setThrottledValue] = useState(value);
  const lastRan = useRef(Date.now());
  useEffect(() => {
    const now = Date.now();
    if (now - lastRan.current >= delay) {
      setThrottledValue(value);
      lastRan.current = now;
    } else {
      const timer = setTimeout(() => {
        setThrottledValue(value);
        lastRan.current = Date.now();
      }, delay - (now - lastRan.current));
      return () => clearTimeout(timer);
    }
  }, [value, delay]);
  return throttledValue;
}
\`\`\`

## 3. 内存优化
### 避免内存泄漏
\`\`\`javascript
function useEventListener(event, handler) {
  useEffect(() => {
    window.addEventListener(event, handler);
    return () => window.removeEventListener(event, handler);
  }, [event, handler]);
}
\`\`\`

### 使用WeakMap
\`\`\`javascript
const privateData = new WeakMap();
class User {

                content: `# Java基础面试题汇总

## 1. Java数据类型
Java中的数据类型分为**基本数据类型**和**引用数据类型**两大类。

### 1.1 基本数据类型（8种）
| 数据类型 | 位数 | 取值范围 | 默认值 | 示例 |
|---|---|---|---|---|
| byte | 8位 | -128 到 127 | 0 | \`byte num = 10;\` |
| short | 16位 | -32768 到 32767 | 0 | \`short num = 100;\` |
| int | 32位 | -2147483648 到 2147483647 | 0 | \`int num = 1000;\` |
| long | 64位 | -9223372036854775808 到 9223372036854775807 | 0L | \`long num = 1000000L;\` |
| float | 32位 | 单精度浮点数 | 0.0f | \`float num = 3.14f;\` |
| double | 64位 | 双精度浮点数 | 0.0d | \`double num = 3.14159;\` |
| char | 16位 | 0 到 65535 | '\\u0000' | \`char ch = 'A';\` |
| boolean | 1位 | true 或 false | false | \`boolean flag = true;\` |

### 1.2 引用数据类型
- 类（Class）
- 接口（Interface）
- 数组（Array）

> **注意**：引用类型存储的是对象在内存中的地址，而不是对象本身。

## 2. final关键字
final可以修饰**类**、**方法**和**变量**，但不能修饰构造器。

### 2.1 修饰类
被final修饰的类**不能被继承**，但可以被实例化。例如：String类、System类、所有包装类（Integer、Long等）。

### 2.2 修饰方法
被final修饰的方法**不能被子类重写**，但可以被子类继承使用。

> **重要**：final和abstract不能同时使用，因为abstract方法必须被重写。

### 2.3 修饰变量
被final修饰的变量称为**常量**，只能赋值一次：
- 成员常量：必须在定义时、构造器或代码块中初始化
- 局部常量：使用前必须赋值
- 静态常量：只能在定义时或静态代码块中初始化

\`\`\`java
public class FinalExample {
    // 静态常量
    public static final int MAX_VALUE = 100;
    // 成员常量
    private final String name;

    public FinalExample(String name) {
        this.name = name;
    }

    // final方法
    public final void printInfo() {
        System.out.println("Name: " + name);
    }
}
\`\`\`

## 3. ==和equals()的区别
### ==运算符
- 对于**基本数据类型**：比较的是值是否相等
- 对于**引用数据类型**：比较的是内存地址是否相等（是否是同一个对象）

### equals()方法
- Object类中默认实现与==等价（比较地址）
- 大多数类（如String、Integer）会重写equals()方法，实现**内容比较**

\`\`\`java
String s1 = new String("hello");
String s2 = new String("hello");
System.out.println(s1 == s2);       // false（不同对象）
System.out.println(s1.equals(s2));  // true（内容相同）
\`\`\`

## 4. String为什么不可变？
String类的不可变性是通过以下设计实现的：
1. 存储字符的数组是\`private final char[] value\`
2. 没有提供修改内容的公共方法
3. 所有修改操作都会返回一个新的String对象

### 不可变的好处
- **线程安全**：多个线程可以安全共享同一个String对象
- **性能优化**：可以使用字符串常量池，节省内存
- **安全性**：用于存储敏感信息（如密码）时不会被篡改

> **提示**：如果需要频繁修改字符串，使用StringBuilder（单线程）或StringBuffer（多线程）。

## 5. 面向对象三大特性

### 5.1 封装（Encapsulation）
将数据和操作数据的方法绑定在一起，隐藏内部实现细节，只暴露必要的接口。

\`\`\`java
public class BankAccount {
    private double balance; // 私有属性，外部无法直接访问

    public double getBalance() { return balance; }

    public void deposit(double amount) {
        if (amount > 0) {
            balance += amount;
        } else {
            throw new IllegalArgumentException("存款金额必须大于0");
        }
    }

    public void withdraw(double amount) {
        if (amount > 0 && amount <= balance) {
            balance -= amount;
        } else {
            throw new IllegalArgumentException("余额不足或金额无效");
        }
    }
}
\`\`\`

> 封装的核心：**高内聚、低耦合**，通过访问修饰符（private、protected、public）控制可见性。

### 5.2 继承（Inheritance）
子类继承父类的属性和方法，实现代码复用。Java只支持**单继承**（一个类只能有一个直接父类），但支持**多重继承**（通过接口）。

\`\`\`java
// 父类
public class Animal {
    protected String name;

    public Animal(String name) { this.name = name; }

    public void eat() {
        System.out.println(name + "正在吃东西");
    }
}

// 子类
public class Dog extends Animal {
    public Dog(String name) { super(name); }

    @Override
    public void eat() {
        System.out.println(name + "正在吃狗粮");
    }

    public void bark() {
        System.out.println(name + "汪汪叫");
    }
}

// 使用
Dog dog = new Dog("旺财");
dog.eat();  // 输出：旺财正在吃狗粮
dog.bark(); // 输出：旺财汪汪叫
\`\`\`

### 5.3 多态（Polymorphism）
同一个行为具有多个不同表现形式。多态的三个必要条件：**继承**、**重写**、**父类引用指向子类对象**。

\`\`\`java
Animal myPet = new Dog("小黑"); // 父类引用指向子类对象
myPet.eat(); // 调用的是Dog重写后的eat()方法（运行时多态）

// 多态的好处
Animal[] zoo = { new Dog("旺财"), new Cat("小花"), new Bird("小飞") };
for (Animal a : zoo) {
    a.eat(); // 每个动物以不同方式"吃"，无需区分类型
}
\`\`\`

## 6. 抽象类与接口

### 6.1 抽象类（abstract class）
- 不能实例化，只能被继承
- 可以包含抽象方法和具体方法
- 可以有构造器
- 单继承

\`\`\`java
public abstract class Shape {
    protected String color;

    public Shape(String color) { this.color = color; }

    // 抽象方法——子类必须实现
    public abstract double getArea();

    // 具体方法
    public void display() {
        System.out.println("这是一个" + color + "的图形，面积：" + getArea());
    }
}

public class Circle extends Shape {
    private double radius;
    public Circle(String color, double radius) {
        super(color);
        this.radius = radius;
    }
    @Override
    public double getArea() { return Math.PI * radius * radius; }
}
\`\`\`

### 6.2 接口（interface）
- 完全抽象（Java 8+可以有default方法）
- 一个类可以实现多个接口
- 接口之间可以多继承

\`\`\`java
public interface Flyable {
    void fly(); // 默认public abstract
    default void land() { System.out.println("正在降落..."); }
}

public interface Swimmable {
    void swim();
}

// 一个类实现多个接口
public class Duck implements Flyable, Swimmable {
    @Override
    public void fly() { System.out.println("鸭子在飞"); }
    @Override
    public void swim() { System.out.println("鸭子在游泳"); }
}
\`\`\`

### 6.3 抽象类 vs 接口
| 对比项 | 抽象类 | 接口 |
|---|---|---|
| 继承 | 单继承 | 多实现 |
| 构造器 | 有 | 无 |
| 方法 | 抽象+具体 | 抽象+default |
| 成员变量 | 任意类型 | 仅public static final |
| 使用场景 | is-a关系 | can-do能力 |

## 7. 集合框架

### 7.1 常用集合类
| 类型 | 实现类 | 特点 |
|---|---|---|
| List | ArrayList | 数组实现，查询快O(1)，增删慢O(n) |
| List | LinkedList | 双向链表，增删快O(1)，查询慢O(n) |
| Set | HashSet | 基于HashMap，无序，O(1)查找 |
| Set | TreeSet | 红黑树，有序，O(log n) |
| Map | HashMap | 数组+链表+红黑树，O(1)平均 |
| Map | TreeMap | 红黑树，键有序 |

### 7.2 HashMap原理
\`\`\`java
// HashMap存储结构（简化示意）
// JDK 1.8：数组 + 链表 + 红黑树（链表长度>8时转红黑树）
Map<String, Integer> map = new HashMap<>();
map.put("apple", 1);
map.put("banana", 2);

// put流程：
// 1. 计算key的hashCode
// 2. 通过hash值确定数组索引
// 3. 若该位置为空，直接插入
// 4. 若冲突，用链表/红黑树存储（拉链法）
// 5. 若容量超过阈值（默认0.75），扩容为原来的2倍
\`\`\`

## 8. 异常处理机制

### 8.1 异常分类
\`\`\`
Throwable
├── Error（严重错误，不处理）
└── Exception
    ├── RuntimeException（运行时异常，可处理可不处理）
    │   ├── NullPointerException
    │   ├── IndexOutOfBoundsException
    │   └── ArithmeticException
    └── CheckedException（编译时异常，必须处理）
        ├── IOException
        ├── SQLException
        └── ClassNotFoundException
\`\`\`

### 8.2 try-catch-finally
\`\`\`java
public void readFile(String path) {
    FileReader reader = null;
    try {
        reader = new FileReader(path);
        // 读取文件...
    } catch (FileNotFoundException e) {
        System.err.println("文件未找到: " + e.getMessage());
    } catch (IOException e) {
        System.err.println("IO异常: " + e.getMessage());
    } finally {
        // 无论是否发生异常，finally块都会执行
        if (reader != null) {
            try { reader.close(); } catch (IOException e) { e.printStackTrace(); }
        }
    }
}

// try-with-resources（Java 7+自动关闭资源）
public void readFileAuto(String path) {
    try (FileReader reader = new FileReader(path);
         BufferedReader br = new BufferedReader(reader)) {
        String line = br.readLine();
        System.out.println(line);
    } catch (IOException e) {
        e.printStackTrace();
    }
    // reader和br会自动调用close()
}
\`\`\`

## 9. 多线程基础

### 9.1 创建线程的四种方式
\`\`\`java
// 方式1：继承Thread类
class MyThread extends Thread {
    @Override
    public void run() { System.out.println("线程运行中..."); }
}
new MyThread().start();

// 方式2：实现Runnable接口（推荐——避免单继承限制）
class MyRunnable implements Runnable {
    @Override
    public void run() { System.out.println("线程运行中..."); }
}
new Thread(new MyRunnable()).start();

// 方式3：实现Callable接口（有返回值，可抛异常）
class MyCallable implements Callable<String> {
    @Override
    public String call() throws Exception { return "执行结果"; }
}
FutureTask<String> task = new FutureTask<>(new MyCallable());
new Thread(task).start();
String result = task.get(); // 获取返回值（阻塞）

// 方式4：线程池（推荐——复用线程，性能更好）
ExecutorService executor = Executors.newFixedThreadPool(5);
executor.submit(() -> System.out.println("线程池执行"));
executor.shutdown();
\`\`\`

### 9.2 线程安全与synchronized
\`\`\`java
public class Counter {
    private int count = 0;

    // synchronized保证同一时刻只有一个线程访问
    public synchronized void increment() {
        count++;
    }

    // 同步代码块（粒度更细）
    public void incrementBlock() {
        synchronized (this) {
            count++;
        }
    }

    public synchronized int getCount() { return count; }
}
\`\`\`

## 10. JVM内存模型简介

### 10.1 运行时数据区域
| 区域 | 线程共享 | 存储内容 | 异常 |
|---|---|---|---|
| 堆（Heap） | 是 | 对象实例、数组 | OutOfMemoryError |
| 方法区（Method Area） | 是 | 类信息、常量、静态变量 | OutOfMemoryError |
| 虚拟机栈（VM Stack） | 否 | 局部变量、方法调用 | StackOverflowError |
| 本地方法栈 | 否 | native方法 | StackOverflowError |
| 程序计数器 | 否 | 当前执行指令地址 | 无 |

### 10.2 堆内存结构（分代模型）
\`\`\`
堆内存 = 年轻代(1/3) + 老年代(2/3)
年轻代 = Eden区(8/10) + Survivor0(1/10) + Survivor1(1/10)
\`\`\`

- **Eden区**：新对象首先分配在这里
- **Survivor区**：经过一次Minor GC存活的对象
- **老年代**：长期存活的对象（经过多次GC或大对象直接进入）

> **GC触发**：Eden区满 → Minor GC；老年代满 → Full GC（STW，暂停所有用户线程）。

> **面试重点**：理解==与equals、String不可变、面向对象三大特性、HashMap原理、异常体系、多线程创建方式、JVM内存区域，这些是Java面试中最高频的基础知识点。
`

## 1. Promise链式调用
\`\`\`javascript
fetchUserData(userId)
  .then(user => fetchPosts(user.id))
  .then(posts => filterActivePosts(posts))

  .catch(error => {

### Promise.all并发执行
\`\`\`javascript
async function loadDashboardData() {
  try {
    const [user, posts, notifications] = await Promise.all([
      fetchUser(), fetchPosts(), fetchNotifications()
    ]);
    return { user, posts, notifications };
  } catch (error) {
    console.error('加载数据失败:', error);
    throw error;
  }
}
\`\`\`

### Promise.race竞速
\`\`\`javascript
async function fetchWithTimeout(url, timeout = 5000) {
  const fetchPromise = fetch(url);
  const timeoutPromise = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('请求超时')), timeout)
  );
  return Promise.race([fetchPromise, timeoutPromise]);
}
\`\`\`

## 2. async/await最佳实践
\`\`\`javascript
// ✅ 推荐：使用try-catch
async function getUserData() {
  try {
    const user = await fetchUser();
    const posts = await fetchPosts(user.id);
    return { user, posts };
  } catch (error) {
    console.error('获取用户数据失败:', error);
    throw error;
  }
}
\`\`\`

## 3. Stream流处理
\`\`\`javascript
const fs = require('fs');
const readline = require('readline');

async function processLargeFile(filePath) {
  const fileStream = fs.createReadStream(filePath);
  const rl = readline.createInterface({
    input: fileStream,
    crlfDelay: Infinity
  });
  for await (const line of rl) {
    await processLine(line);
  }
}
\`\`\`

## 4. Worker Threads
\`\`\`javascript
const { Worker } = require('worker_threads');

function runTask(data) {
  return new Promise((resolve, reject) => {
    const worker = new Worker('./worker.js', { workerData: data });
    worker.on('message', resolve);
    worker.on('error', reject);
    worker.on('exit', (code) => {
      if (code !== 0) reject(new Error(\`Worker stopped with exit code \${code}\`));
    });
  });
}
\`\`\`

## 5. 异步迭代器
\`\`\`javascript
async function* asyncRange(start, end) {
  for (let i = start; i <= end; i++) {
    await new Promise(resolve => setTimeout(resolve, 100));
    yield i;
  }
}
(async () => {
  for await (const num of asyncRange(1, 5)) {
    console.log(num);
  }
})();
\`\`\`

> **性能提示**：合理选择异步模式，避免回调地狱和过度嵌套。

## 1. 盒模型
CSS盒模型是CSS布局的基础，分为两种：

### 1.1 标准盒模型（content-box）
\`\`\`css
box-sizing: content-box;
\`\`\`
- 元素总宽度 = width + padding + border + margin
- width只包含内容区域

### 1.2 怪异盒模型（border-box）
\`\`\`css
box-sizing: border-box;
\`\`\`
- 元素总宽度 = width + margin
- width包含内容、padding和border

> **推荐**：全局设置\`box-sizing: border-box\`，让布局更直观。

## 2. 选择器优先级
CSS选择器优先级从高到低：
1. !important（最高）
2. 内联样式（style属性）
3. ID选择器（#id）
4. 类选择器、属性选择器、伪类选择器
5. 标签选择器、伪元素选择器
6. 通配符选择器（*）

### 优先级计算
- 内联样式：1000
- ID选择器：100
- 类/属性/伪类：10
- 标签/伪元素：1

\`\`\`css
/* 优先级：100 + 10 + 1 = 111 */
#container .box p { color: red; }
\`\`\`

## 3. Flex布局
### 3.1 容器属性
\`\`\`css
.container {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}
\`\`\`

### 3.2 项目属性
\`\`\`css
.item {
  flex: 1;
  order: 1;
  align-self: flex-end;
}
\`\`\`

## 4. 重排与重绘
- **重排（回流）**：修改width/height、添加/删除DOM、改变字体大小等 → 性能开销大
- **重绘**：修改color、background-color等 → 性能开销较小
- **优化**：使用transform和opacity实现动画（不会触发重排重绘）、开启GPU加速\`transform: translateZ(0)\`

## 5. 响应式布局
\`\`\`css
@media (max-width: 768px) {
  .container { flex-direction: column; }
}
\`\`\`
- **rem**：相对于根元素字体大小
- **vw/vh**：相对于视口宽度/高度
- **em**：相对于父元素字体大小
`

## 1. 什么是ArkTS？
ArkTS是华为为HarmonyOS量身打造的**声明式UI开发语言**，基于TypeScript扩展而来，融合了声明式UI语法和高效的状态管理机制。它是HarmonyOS应用开发的主流语言。

### 核心特点
- **声明式UI**：描述"长什么样"而非"怎么画"
- **类型安全**：基于TypeScript，编译期类型检查
- **状态驱动**：数据变化自动触发UI更新
- **组件化**：一切皆组件，支持嵌套与复用

## 2. 第一个ArkTS应用

### 2.1 基本结构
\`\`\`typescript
// Index.ets
@Entry
@Component
struct Index {
  @State message: string = 'Hello, HarmonyOS!';

  build() {
    Column() {
      Text(this.message)
        .fontSize(30)
        .fontWeight(FontWeight.Bold)
        .fontColor('#333333')

      Button('点击我')
        .margin({ top: 20 })
        .onClick(() => {
          this.message = '你好，鸿蒙！';
        })
    }
    .width('100%')
    .height('100%')
    .justifyContent(FlexAlign.Center)
  }
}
\`\`\`

### 2.2 核心装饰器
| 装饰器 | 作用 | 说明 |
|---|---|---|
| @Entry | 标记入口组件 | 一个页面只有一个@Entry |
| @Component | 声明自定义组件 | 可被复用的UI单元 |
| @State | 组件内部状态 | 状态变化触发UI刷新 |
| @Prop | 父传子单向同步 | 子组件接收父组件数据 |
| @Link | 父子双向同步 | 子组件可修改父组件状态 |
| @Provide/@Consume | 跨层级传递 | 祖先与后代组件间数据共享 |

## 3. 声明式UI语法

import http from '@ohos.net.http';

// 封装网络请求工具类
class HttpUtil {
  static async get<T>(url: string): Promise<T> {
    const httpRequest = http.createHttp();
    try {
      const response = await httpRequest.request(
        url,
        {
          method: http.RequestMethod.GET,
          header: { 'Content-Type': 'application/json' },
          connectTimeout: 10000,
          readTimeout: 10000
        }
      );
      if (response.responseCode === 200) {
        return JSON.parse(response.result as string) as T;
      }
      throw new Error(\`请求失败，状态码：\${response.responseCode}\`);
    } finally {
      httpRequest.destroy(); // 务必销毁，释放资源
    }
  }

  static async post<T>(url: string, data: object): Promise<T> {
    const httpRequest = http.createHttp();
    try {
      const response = await httpRequest.request(
        url,
        {
          method: http.RequestMethod.POST,
          header: { 'Content-Type': 'application/json' },
          extraData: JSON.stringify(data),
          connectTimeout: 10000,
          readTimeout: 10000
        }
      );
      if (response.responseCode === 200) {
        return JSON.parse(response.result as string) as T;
      }
      throw new Error(\`请求失败，状态码：\${response.responseCode}\`);
    } finally {
      httpRequest.destroy();
    }
  }
}

import preferences from '@ohos.data.preferences';
import common from '@ohos.app.ability.common';

class PreferencesUtil {
  private static context = getContext(this) as common.UIAbilityContext;
  private static PREF_NAME = 'my_app_preferences';

  static async put(key: string, value: string | number | boolean): Promise<void> {
    const prefs = await preferences.getPreferences(this.context, this.PREF_NAME);
    await prefs.put(key, value);
    await prefs.flush(); // 持久化到磁盘
  }

  static async get(key: string, defaultValue: string | number | boolean): Promise<string | number | boolean> {
    const prefs = await preferences.getPreferences(this.context, this.PREF_NAME);
    return await prefs.get(key, defaultValue);
  }

  static async remove(key: string): Promise<void> {
    const prefs = await preferences.getPreferences(this.context, this.PREF_NAME);
    await prefs.delete(key);
    await prefs.flush();
  }
}

const STORE_CONFIG = {
  name: 'my_database.db',

    title TEXT NOT NULL,
    content TEXT,
    created_at INTEGER DEFAULT (strftime('%s','now'))
  )
\`;

async function initDatabase() {

  await store.executeSql(SQL_CREATE_TABLE);

## 1. 为什么JavaScript是单线程？
JavaScript作为浏览器脚本语言，主要用途是与用户交互和操作DOM。如果是多线程，会带来复杂的同步问题——一个线程修改DOM，另一个线程删除DOM，浏览器无法确定如何处理。单线程简化了编程模型。

## 2. 事件循环（Event Loop）
### 2.1 执行栈
所有同步代码都会在**执行栈**中执行，函数调用会入栈，执行完成后出栈。

### 2.2 任务队列
- **宏任务（MacroTask）**：script整体代码、setTimeout、setInterval、AJAX、UI渲染
- **微任务（MicroTask）**：Promise.then、async/await、MutationObserver

### 2.3 执行顺序
1. 执行同步代码（宏任务）
2. 执行所有微任务
3. 渲染UI
4. 执行下一个宏任务

> **重要**：微任务总是在当前宏任务执行完后立即执行，在UI渲染之前。

## 3. 代码示例
\`\`\`javascript
console.log('start');
setTimeout(() => { console.log('setTimeout'); }, 0);
Promise.resolve()
  .then(() => { console.log('promise1'); })
  .then(() => { console.log('promise2'); });
console.log('end');
// 输出：start → end → promise1 → promise2 → setTimeout
\`\`\`

## 4. async/await
\`\`\`javascript
async function async1() {
  console.log('async1 start');
  await async2();
  console.log('async1 end');
}
async function async2() { console.log('async2'); }
console.log('script start');
async1();
console.log('script end');
// 输出：script start → async1 start → async2 → script end → async1 end
\`\`\`
> **注意**：await后面的代码会被加入微任务队列。

## 5. Node.js事件循环
Node.js的事件循环分为6个阶段：timers → pending callbacks → idle/prepare → poll → check → close callbacks。Node.js中微任务在每个阶段之间执行。

## 1. 导航阶段
### 1.1 URL解析
浏览器首先解析输入的URL，确定协议、域名、端口、路径和查询参数。例如：\`https://www.example.com:8080/path?name=test#hash\`

### 1.2 DNS解析
将域名转换为IP地址，查询顺序：浏览器缓存 → 操作系统缓存（hosts文件） → 路由器缓存 → ISP DNS缓存 → 递归查询DNS服务器。

### 1.3 建立TCP连接
通过**三次握手**建立TCP连接：
1. 客户端发送SYN包（seq=x）
2. 服务器返回SYN+ACK包（seq=y, ack=x+1）
3. 客户端发送ACK包（ack=y+1）

### 1.4 发送HTTP请求
建立连接后，浏览器发送HTTP请求，包含请求行、请求头、请求体。

## 2. 服务器处理阶段
服务器接收请求 → 路由匹配 → 处理业务逻辑 → 生成HTTP响应（状态行、响应头、响应体）。

## 3. 渲染阶段
HTML字节流 → 分词器 → Token → 节点 → DOM树
CSS字节流 → 解析器 → CSS规则 → CSSOM树
DOM树 + CSSOM树 → 渲染树 → 布局 → 绘制 → 合成（GPU完成）

## 4. 断开连接
通过**四次挥手**关闭TCP连接。

## 5. 关键优化点
- **DNS预解析**：\`<link rel="dns-prefetch" href="//example.com">\`
- **TCP复用**：HTTP/1.1的Keep-Alive
- **缓存策略**：强缓存（Cache-Control）和协商缓存（ETag）
- **资源压缩**：Gzip、Brotli压缩
- **懒加载**：图片和组件按需加载
- **CDN加速**：静态资源就近访问

HTTP缓存是前端性能优化的重要手段，可以减少网络请求，提高页面加载速度。

## 1. 缓存分类
### 1.1 强缓存
不需要向服务器发送请求，直接从本地缓存读取资源。
- **Cache-Control**（HTTP/1.1）：\`max-age=3600\`、\`public\`、\`private\`、\`no-cache\`、\`no-store\`
- **Expires**（HTTP/1.0）：值为绝对时间，依赖客户端时间

### 1.2 协商缓存
强缓存失效后，浏览器发送请求到服务器，由服务器判断是否使用缓存。
- **基于最后修改时间**：\`Last-Modified\` / \`If-Modified-Since\`
- **基于ETag**：\`ETag: "abc123"\` / \`If-None-Match: "abc123"\`（比Last-Modified更精确）

## 2. 缓存位置
按优先级从高到低：Service Worker → Memory Cache → Disk Cache → Push Cache

## 3. 缓存策略
- **不常变化的资源**：\`Cache-Control: public, max-age=31536000\` + 文件指纹
- **经常变化的资源**：\`Cache-Control: no-cache\` + ETag
- **不缓存的资源**：\`Cache-Control: no-store, no-cache, must-revalidate\`

## 4. 常见问题
- 强制刷新页面（Ctrl+F5）会跳过强缓存
- 304：服务器只返回响应头，使用本地缓存的资源
- 200：服务器返回完整的资源

        // ===================== 打开文章详情 =====================
        function showArticleDetail(index) {
            const article = articles[index];
            // 填充基本信息
            document.getElementById('detailTitle').innerText = article.title;
            document.getElementById('detailTime').innerText = article.time;
            document.getElementById('detailTag').innerText = article.tag;
            // 解析Markdown内容
            const htmlContent = marked.parse(article.content);
            document.getElementById('detailContent').innerHTML = htmlContent;
            // 为所有代码块添加复制按钮
            addCopyButtons();
            // 显示面板
            document.getElementById('articleDetail').classList.add('show');
            document.getElementById('mask').classList.add('show');
            document.body.classList.add('no-scroll');
            // 滚动到顶部
            document.getElementById('articleDetail').scrollTop = 0;
        }

        // ===================== 关闭文章详情 =====================
        function closeArticleDetail() {
            document.getElementById('articleDetail').classList.remove('show');
            document.getElementById('mask').classList.remove('show');
            document.body.classList.remove('no-scroll');
        }

        // ===================== 添加代码复制按钮 =====================
        function addCopyButtons() {
            const codeBlocks = document.querySelectorAll('.detail-content pre');
            codeBlocks.forEach((pre, index) => {
                // 创建复制按钮
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '复制代码';
                copyBtn.setAttribute('data-index', index);
                // 绑定点击事件
                copyBtn.addEventListener('click', function() {
                    const code = pre.querySelector('code').innerText;
                    // 复制到剪贴板
                    navigator.clipboard.writeText(code).then(() => {
                        this.innerText = '已复制 ✓';
                        this.classList.add('copied');
                        // 2秒后恢复
                        setTimeout(() => {
                            this.innerText = '复制代码';
                            this.classList.remove('copied');
                        }, 2000);
                    }).catch(err => {
                        this.innerText = '复制失败';
                        console.error('复制失败:', err);
                    });
                });
                pre.appendChild(copyBtn);
            });
        }

        // ===================== 原有鼠标魔法效果 =====================
        window.addEventListener("mousemove", function(e) {
            document.querySelectorAll(".magical").forEach(element => {
                const rect = element.getBoundingClientRect();
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;
                element.style.setProperty("--mouse-x", `${offsetX}px`);
                element.style.setProperty("--mouse-y", `${offsetY}px`);
            });
        });

        // ===================== 页面初始化 =====================
        document.addEventListener('DOMContentLoaded', function() {
            renderBlogList();
            // 支持ESC键关闭面板
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeArticleDetail();
                }
            });
        });
    </script>
    <script src="./js/main.min.js"></script>
    <script src='./js/anime.js'></script>
    <script src='./js/firework.js'></script>
</body>
